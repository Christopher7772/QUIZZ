# =====================================================
# Configuration de l'application Spring Boot
# =====================================================

# Nom de l'application (visible dans les logs)
spring.application.name=Quiz App

# Port du serveur (8080 par défaut)
server.port=8080

# Désactive le cache des templates Thymeleaf en mode développement
# (mettre à true en production pour de meilleures performances)
spring.thymeleaf.cache=false

# Encodage UTF-8 pour les templates
spring.thymeleaf.encoding=UTF-8
